name: Fix target labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'ax.set_title("Lợi suất cuộn 12 tháng so với mục tiêu")',
              'ax.set_title("Rolling Return 12 tháng so với mục tiêu")',
          )
          text = text.replace(
              'ax.set_ylabel("Lợi suất cuộn 12 tháng (%)")',
              'ax.set_ylabel("Rolling Return 12 tháng (%)")',
          )

          old = '''        st.subheader("6.3. MỤC TIÊU LỢI NHUẬN")
        target_summary = results.get("target_summary")
        if isinstance(target_summary, pd.DataFrame) and not target_summary.empty:
            render_df(target_summary, hide_index=True)
'''

          new = '''        st.subheader("6.3. MỤC TIÊU LỢI NHUẬN")
        target_summary = results.get("target_summary")
        if isinstance(target_summary, pd.DataFrame) and not target_summary.empty:
            target_summary = target_summary.copy()
            if "Mục tiêu" in target_summary.columns:
                target_summary = target_summary.rename(
                    columns={"Mục tiêu": "Lợi suất mục tiêu"}
                )
            if "Lợi suất kỳ vọng" in target_summary.columns and "Lợi suất mục tiêu" in target_summary.columns:
                target_summary["Chênh lệch"] = (
                    pd.to_numeric(target_summary["Lợi suất kỳ vọng"], errors="coerce")
                    - pd.to_numeric(target_summary["Lợi suất mục tiêu"], errors="coerce")
                )
            preferred = [
                "Lợi suất mục tiêu",
                "Lợi suất kỳ vọng",
                "Chênh lệch",
                "Rủi ro thấp nhất",
                "Sharpe",
                "Trạng thái",
            ]
            ordered = [c for c in preferred if c in target_summary.columns]
            remaining = [c for c in target_summary.columns if c not in ordered]
            target_summary = target_summary[ordered + remaining]
            render_df(target_summary, hide_index=True)
'''

          if old not in text:
              raise SystemExit("Không tìm thấy block 6.3 cần thay thế")

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/fix-target-labels.yml
          git commit -m "Clarify target return and rolling return label"
          git push
